[platformio]
default_envs = app

[env:e32r40t]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 460800
build_src_filter =
  +<main.cpp>
  -<touch_raw.cpp>
lib_deps =
  bodmer/TFT_eSPI@2.5.43
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D USER_SETUP_LOADED=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=27
  -D TFT_BACKLIGHT_ON=HIGH
  -D TOUCH_CS=33
  -D TOUCH_IRQ=36
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=6000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1

[env:app]
extends = env:e32r40t
board_build.partitions = min_spiffs.csv
build_src_filter =
  -<*>
  +<app.cpp>
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  lvgl/lvgl@8.3.11
  bblanchon/ArduinoJson@7.4.2
  https://github.com/tzapu/WiFiManager.git#v2.0.17
build_flags =
  ${env:e32r40t.build_flags}
  -D LV_CONF_INCLUDE_SIMPLE=1
  -I include

[env:touch-raw]
extends = env:e32r40t
build_src_filter =
  -<*>
  +<touch_raw.cpp>
